<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生比較カラーマップ</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* タブ切り替え */
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; gap: 10px; }
        .tab-btn { padding: 10px 20px; cursor: pointer; border: 2px solid #ddd; border-radius: 5px; background: #eee; transition: 0.3s; }
        .tab-btn.active { background: #3498db; color: white; border-color: #3498db; font-weight: bold; }

        /* 比較エリア */
        .comparison-area { display: flex; flex-direction: column; gap: 20px; margin: 20px 0; border: 1px solid #eee; padding: 15px; border-radius: 10px; }
        .person-row { text-align: left; }
        .person-name { font-weight: bold; margin-bottom: 5px; color: #555; }
        .chart { display: flex; flex-wrap: wrap; gap: 3px; min-height: 40px; background: #fafafa; padding: 10px; border-radius: 8px; }
        
        /* タイル */
        .age-tile { width: 25px; height: 25px; border-radius: 3px; font-size: 8px; color: white; display: flex; align-items: center; justify-content: center; }

        .controls { margin-top: 20px; padding-top: 20px; border-top: 1px solid #ddd; text-align: center; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: #3498db; color: white; }
        .btn-yellow { background: #f1c40f; color: black; }
        .btn-red { background: #e74c3c; color: white; }
    </style>
</head>
<body>

<div class="container">
    <h2>人生カラーマップ比較</h2>
    
    <div class="tabs">
        <div class="tab-btn active" onclick="switchPerson(0)">自分</div>
        <div class="tab-btn" onclick="switchPerson(1)">Aさん</div>
        <div class="tab-btn" onclick="switchPerson(2)">Bさん</div>
    </div>

    <div class="comparison-area">
        <div class="person-row">
            <div class="person-name">👤 自分</div>
            <div id="chart-0" class="chart"></div>
        </div>
        <div class="person-row">
            <div class="person-name">👤 Aさん</div>
            <div id="chart-1" class="chart"></div>
        </div>
        <div class="person-row">
            <div class="person-name">👤 Bさん</div>
            <div id="chart-2" class="chart"></div>
        </div>
    </div>

    <div class="controls">
        <p id="statusDisplay"><strong id="currentPersonName">自分</strong> のデータを編集中: <span id="ageCount">0</span>歳</p>
        <button class="btn-blue" onclick="addYear('#3498db')">良かった</button>
        <button class="btn-yellow" onclick="addYear('#f1c40f')">普通</button>
        <button class="btn-red" onclick="addYear('#e74c3c')">キツかった</button>
        <br>
        <button style="background:#2ecc71; color:white;" onclick="saveAll()">全員分を保存</button>
        <button style="background:#95a5a6; color:white;" onclick="resetCurrent()">選択中の人をリセット</button>
    </div>
</div>

<script>
    let currentIdx = 0;
    let data = [[], [], []]; // 3人分の色データを格納
    const names = ["自分", "Aさん", "Bさん"];

    // 読み込み時に復元
    window.onload = () => {
        const saved = localStorage.getItem('multiLifeData');
        if (saved) {
            data = JSON.parse(saved);
            data.forEach((personData, idx) => renderChart(idx));
        }
        updateDisplay();
    };

    function switchPerson(idx) {
        currentIdx = idx;
        document.querySelectorAll('.tab-btn').forEach((btn, i) => {
            btn.classList.toggle('active', i === idx);
        });
        updateDisplay();
    }

    function addYear(color) {
        if (data[currentIdx].length >= 100) return;
        data[currentIdx].push(color);
        renderChart(currentIdx);
        updateDisplay();
    }

    function renderChart(idx) {
        const chart = document.getElementById(`chart-${idx}`);
        chart.innerHTML = '';
        data[idx].forEach((color, age) => {
            const tile = document.createElement('div');
            tile.className = 'age-tile';
            tile.style.backgroundColor = color;
            tile.innerText = age;
            chart.appendChild(tile);
        });
    }

    function updateDisplay() {
        document.getElementById('currentPersonName').innerText = names[currentIdx];
        document.getElementById('ageCount').innerText = data[currentIdx].length;
    }

    function saveAll() {
        localStorage.setItem('multiLifeData', JSON.stringify(data));
        alert('3人全員のデータをブラウザに保存しました！');
    }

    function resetCurrent() {
        if(confirm(`${names[currentIdx]}のデータをリセットしますか？`)) {
            data[currentIdx] = [];
            renderChart(currentIdx);
            updateDisplay();
        }
    }
</script>

</body>
</html>
